services:

  db:
    image: postgres
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: dbpass
      POSTGRES_USER: dbuser
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
  redis:
    image: redis:8.4.0
    restart: unless-stopped
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    ports:
      - 6379:6379
    networks:
      - redisNetwork
  redis_insight:
    image: redis/redisinsight
    restart: unless-stopped
    ports:
      - 5540:5540
    volumes:
      - redis_volume_data:/db
    networks:
      - redisNetwork
networks:
  redisNetwork:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.5"

volumes:
  redis_volume_data:
  redis_data:
